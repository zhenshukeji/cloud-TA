# 项目相关配置
zhenshu:
  # 名称
  name: RuoYi
  # 版本
  version: 2.2.0
  # 版权年份
  copyrightYear: 2019
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/zhenshu/uploadPath，Linux配置 /home/zhenshu/uploadPath）
  # 社区版（OS011）：上传根目录走本地持久卷，由环境变量 UPLOAD_ROOT 指定（Docker 挂卷即指向卷内路径）
  profile: ${UPLOAD_ROOT:./file/}
  # 获取ip地址开关
  addressEnabled: false
  fileUrl: ${UPLOAD_ROOT:./file/}

# 日志配置
logging:
  level:
    com.zhenshu: info
    org.springframework: warn

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    # 开源社区版默认使用 community profile（只依赖 MySQL/Redis/令牌密钥）；
    # 需要原来的开发/容器配置时用 SPRING_PROFILES_ACTIVE=dev|docker 覆盖
    active: ${SPRING_PROFILES_ACTIVE:community}
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size:  500MB
      # 设置总上传的文件大小
      max-request-size:  500MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  mvc:
    dispatch-options-request: true
  datasource:
    druid:
      # 非 dev 环境关闭 Druid 监控台，避免数据库/SQL 明细被匿名暴露（dev 仍开启 stat-view-servlet）
      stat-view-servlet:
        enabled: false

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌秘钥
  secret: ${TOKEN_SECRET}
  # 令牌有效期（默认5小时）
  expireTime: 300

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.zhenshu.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mybatis/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  reasonable: false
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger（默认关闭；仅 application-dev.yml 覆写为 true）
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/educenter/*,/mec/*,/sale/*,/platform/*,/website/*,/account/*

# 代码生成
mybatis-plus:
  # 如果是放在src/main/java目录下 classpath:/com/yourpackage/*/mapper/*Mapper.xml
  # 如果是放在resource目录 classpath:/mapper/*Mapper.xml
  mapper-locations: classpath:/mybatis/**/*Mapper.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.zhenshu.**.domain
  global-config:
    #主键类型  0:"数据库ID自增", 1:"用户输入ID",2:"全局唯一ID (数字类型唯一ID)", 3:"全局唯一ID UUID";
    id-type: 0
    #字段策略 0:"忽略判断",1:"非 NULL 判断"),2:"非空判断"
    field-strategy: 1
    logic-delete-value: 1 # 逻辑已删除值(默认为 1)
    logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
    sql-injector: com.baomidou.mybatisplus.mapper.LogicSqlInjector
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    #配置JdbcTypeForNull
    jdbc-type-for-null: 'null'

