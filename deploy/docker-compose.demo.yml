# =====================================================================
# 云朵教务社区版 · 演示数据叠加文件（OS014 + OS013）
# ---------------------------------------------------------------------
# 作用：在基础 compose 之上，把 003_demo_data.sql 也挂进 MySQL 的初始化目录，
#       让「空数据卷首次启动」直接得到一间可演示的虚构机构
#       （春芽艺术工作室：3 课程 / 3 班级 / 10 学员 / 一周课表 / 已上 5 次课）。
#
# 用法（必须同时给两个 -f，顺序不能反）：
#   docker compose --env-file deploy/.env \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.demo.yml up -d --build
#
# 说明：Compose 对 volumes 按「容器内路径」合并，因此这里是**追加**一条挂载，
#       不会覆盖基础文件里的 mysql-data 与 001/002 两条挂载。
#       若你的 Compose 版本行为不同（极少见），等价做法是在基础文件里手工加同一行。
#
# ⚠ 演示数据是虚构样例，会写入固定主键 1–99 区间的业务数据。
#   已有真实数据的库**不要**套用本文件。
# =====================================================================

services:
  mysql:
    volumes:
      - ../database/003_demo_data.sql:/docker-entrypoint-initdb.d/03-003-demo-data.sql:ro
