# =====================================================================
# 云朵教务社区版 · Nginx 站点配置（OS014）
# 只做两件事：
#   1) 托管前端静态资源（Vue SPA，history 路由回落到 index.html）；
#   2) 把 /api/ 反代到后端（后端 context-path 为 /，因此要去掉 /api 前缀）。
# 不暴露数据库、Redis、后端管理面或任何其他路径。
# =====================================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 学员导入 xlsx 等上传
    client_max_body_size 20m;

    # 访问日志不记录 Authorization（避免把令牌写进磁盘）
    access_log  /var/log/nginx/access.log;

    # ---- 后端 API ----
    # 前端 .env.production 里 VUE_APP_BASE_API = '/api'，
    # 所有请求（含上传与 /profile/** 图片回读）都带这个前缀。
    # 必须用 ^~ —— 否则 /api/xxx.js 这类路径会被下面的「静态资源正则 location」抢走，
    # 变成去磁盘找文件而不是反代。
    location ^~ /api/ {
        proxy_pass         http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ---- 前端静态资源 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后能立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
